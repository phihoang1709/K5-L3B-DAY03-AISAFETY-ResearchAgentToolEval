# Tool declarations for the research agent.
# Each description states the routing boundary and the argument convention
# that the model must follow.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Ask the user for one missing detail or explicit confirmation. Use when a
      required person, account, URL, recipient, or choice is missing. Do not
      guess missing values. Do not use this as a research or retrieval tool.
    parameters:
      type: object
      properties:
        question:
          {type: string, default: "", description: "The precise missing detail or confirmation to ask the user for."}
        response_type:
          {type: string, enum: [text, yes_no, choice], default: "text", description: "Use text for missing details, yes_no before an external action, or choice when presenting options."}
        options:
          {type: array, default: [], items: {type: string}, description: "Choice labels when response_type is choice; otherwise leave empty."}
      required: [question]

  - name: timeline
    description: >-
      Retrieve recent posts from one specific account. Use only when the user
      identifies the person or account. Do not use for a topic search and do not
      guess an account when the person is unspecified. The screenname must not
      include @; map known names such as Sam Altman to sama, Elon Musk to
      elonmusk, and Andrej Karpathy to karpathy.
    parameters:
      type: object
      properties:
        screenname:
          {type: string, default: "", description: "Account handle without a leading @; preserve the requested account."}
        limit:
          {type: integer, default: 5, description: "Exact number of recent posts requested by the user; default to 5 only when no count is given."}
      required: [screenname]

  - name: social_search
    description: >-
      Search social posts by a topic or keyword across accounts. Use for
      questions about what people are discussing, not for posts from one named
      account and not for ordinary web search. Use search_type Latest for
      recent posts and Top only when the user asks for popular or top posts.
    parameters:
      type: object
      properties:
        query:
          {type: string, default: "", description: "Topic or keyword to search; keep the user's core topic."}
        search_type:
          {type: string, enum: [Latest, Top], default: "Latest", description: "Latest for recent discussion; Top for popular/top posts."}
        limit:
          {type: integer, default: 5, description: "Number of posts requested; default to 5 when no count is specified."}
      required: [query]

  - name: lookup
    description: >-
      Search the web for information. Use topic=news for current news and
      topic=general for ordinary web lookup. Do not use when the user already
      supplied a concrete URL, when the request is a social-account timeline,
      or when the request is outside research. Keep query to the core subject:
      for example, use AI rather than AI news. Use the requested timeframe.
    parameters:
      type: object
      properties:
        query:
          {type: string, default: "", description: "Core subject or keywords only; omit filler such as news, today, or this week."}
        topic:
          {type: string, enum: [general, news], default: "general", description: "news for news/current events; general for other web research."}
        timeframe:
          {type: string, enum: [day, week, month, year], default: "week", description: "day for today, week for this week, month for this month, year for this year; use the user's requested period."}
        max_results:
          {type: integer, default: 5, description: "Maximum number of web results requested."}
      required: [query]

  - name: fetch
    description: >-
      Read and extract content from a specific URL supplied by the user or
      returned by an earlier search. Use for summarizing a known page. Do not
      use for vague references such as this article without a URL and never
      invent a URL.
    parameters:
      type: object
      properties:
        url:
          {type: string, default: "", description: "Complete URL to read, including its scheme; copy the user's URL exactly."}
      required: [url]

  - name: format
    description: >-
      Format items already collected into a markdown digest. Use only after
      another tool has supplied items or the user supplied the data. Do not use
      it to search, fetch, or infer missing facts.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Existing items to present; do not invent item content."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template:
          {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output layout requested by the user."}
        headline:
          {type: string, default: "", description: "Optional heading for the digest."}
      required: [items, template]

  - name: dedupe
    description: >-
      Remove duplicate items from a list of research results while preserving
      the first occurrence and original order. Use only when the user provides
      or the agent already has items to clean. Do not use it to search, fetch,
      summarize, or invent missing content.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Existing research items to deduplicate; each item should be an object with a URL or title when available."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
      required: [items]

  - name: filter_date
    description: >-
      Filter existing items by their date field within an inclusive date range.
      Use only when items and both YYYY-MM-DD boundaries are supplied. Skip and
      count missing or invalid item dates; never infer dates or retrieve content.
      Ask clarify when a boundary is missing. Invalid ranges return an error.
    parameters:
      type: object
      properties:
        items: {type: array, items: {type: object}, description: "Existing objects with an explicit date field when available."}
        start_date: {type: string, description: "Inclusive start date, exactly YYYY-MM-DD."}
        end_date: {type: string, description: "Inclusive end date, exactly YYYY-MM-DD; not before start_date."}
      required: [items, start_date, end_date]

  - name: rank_relevance
    description: >-
      Rank existing items by distinct query-token overlap in title and summary.
      Use for lexical relevance ranking, not web retrieval or credibility scoring.
      Casefold and split on non-letter/non-number characters; ties keep input order.
      Query must contain a letter or number; limit is a positive integer (default 5).
    parameters:
      type: object
      properties:
        items: {type: array, items: {type: object}, description: "Existing objects with optional string title and summary."}
        query: {type: string, description: "User-supplied relevance query; preserve its terms."}
        limit: {type: integer, default: 5, minimum: 1, description: "Maximum number of ranked items."}
      required: [items, query]

  - name: source_stats
    description: >-
      Count existing items by lowercase HTTP(S) URL hostname, with separate
      missing and invalid URL counts. Use for source distribution only; do not
      assess credibility, retrieve URLs, or invent sources. Subdomains stay distinct.
    parameters:
      type: object
      properties:
        items: {type: array, items: {type: object}, description: "Existing objects with a URL when available."}
      required: [items]

  # ---------------- Existing action and knowledge tools ----------------
  - name: send
    description: >-
      Send prepared text to the configured Telegram destination. This is an
      external side effect and must never be used for ordinary answers or
      out-of-scope requests. First ask for explicit user confirmation; only
      call this tool with confirmed=true after the user says yes. An initial
      call must not send anything.
    parameters:
      type: object
      properties:
        text:
          {type: string, default: "", description: "Exact text to send after the user has reviewed it."}
        confirmed:
          {type: boolean, default: false, description: "Must be true only after explicit user confirmation; otherwise do not send."}
      required: [text]

  - name: policy
    description: >-
      Search the company's local policy documents. Use for internal rules about
      research, citations, privacy, tool use, or external publishing. Do not use
      it for live web facts or public news.
    parameters:
      type: object
      properties:
        query:
          {type: string, default: "", description: "Question or policy terms to find in the internal documents."}
        policy_area:
          {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Narrow search to the relevant internal policy area."}
        top_k:
          {type: integer, default: 3, description: "Maximum number of policy matches."}
      required: [query]

  - name: papers
    description: >-
      Search arXiv for scientific papers or preprints. Use for paper discovery,
      not for general web news or reading a paper whose identifier is already
      known.
    parameters:
      type: object
      properties:
        query:
          {type: string, default: "", description: "Paper topic or keywords."}
        max_results:
          {type: integer, default: 5, description: "Maximum number of papers."}
        sort_by:
          {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Result ordering requested by the user."}
      required: [query]

  - name: paper_text
    description: >-
      Download and extract text from a specified arXiv paper. Use when the user
      provides an arXiv identifier or URL and asks to read its contents. Do not
      use for discovering papers; use papers for discovery.
    parameters:
      type: object
      properties:
        arxiv_url:
          {type: string, default: "", description: "ArXiv identifier or URL supplied by the user."}
        max_pages:
          {type: integer, default: 5, description: "Maximum number of PDF pages to extract."}
        max_chars:
          {type: integer, default: 8000, description: "Maximum number of extracted characters."}
      required: [arxiv_url]
